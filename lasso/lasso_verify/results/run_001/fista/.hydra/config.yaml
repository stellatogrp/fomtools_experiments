experiment:
  name: lasso
  dir: lasso/lasso_verify
  variants:
  - ista
  - fista
  problem:
    m: 15
    'n': 20
    lambd: 0.1
    n_star: 100
    p_star: 0.1
    seed: 0
solver:
  mip_gap: 0.05
  time_limit: 3600
  mip_focus: 2
  threads: ${cluster.cpus}
  seed: 0
  obbt_solver: gurobi
  tighten_objective_bounds: null
  convex_hull_cuts: false
  cut_rounds: 1
  save_logs: true
  extra_params: {}
  obbt_params: {}
schedule:
  k_max: 200
  budget_hours: 20.0
  build_margin_min: 10
  sequential_warm_start: true
  sample_start: true
  n_start_samples: 10000
  start_samples_seed: 0
  run_mip: true
simulator:
  enabled: true
  n_samples: 1000
  seed: 0
  k_max: ${schedule.k_max}
  cross_check: true
cluster:
  cpus: 16
  mem: 32G
  time: null
  slack_min: 30
  partition: ou_sloan_batch
  mail: vranjan1@mit.edu
  mail_type: FAIL,TIME_LIMIT
run_dir: /nfs/sloanlab007/projects/pdopt_proj/vranjan/fomtools_experiments/lasso/lasso_verify/results/run_001
