[project]
name = "fomtools-experiments"
version = "0.1.0"
description = "Experiments for the FOMTools paper"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fomtools[codegen,gurobi]==0.0.5",
    "hydra-core>=1.3",
    "omegaconf>=2.3",
    "clarabel",
    "cvxpy",
    "imageio",
    "matplotlib",
    "numpy",
    "osqp",
    "pillow",
    "scipy",
]

[dependency-groups]
dev = ["ruff"]

[tool.uv]
package = false

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = ["**/out/"]
# Each control study runs as a module from its own directory and imports the
# `common` package one level up. Both roots have to be first-party or import
# sorting splits them into separate blocks.
src = [".", "control", "control/osqp", "control/rapdhg", "lasso", "lasso/lasso_verify", "nnls", "portfolio"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501", "E741"]
