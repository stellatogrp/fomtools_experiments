experiment:
  name: network
  dir: network
  variants:
  - unscaled
  - ruiz
  - unscaled_momentum
  - ruiz_momentum
  problem:
    ns: 10
    nd: 15
    seed: 20
    gain_spread: 100.0
    cost_range:
    - 1.0
    - 10.0
    capacity_range:
    - 2.0
    - 6.0
    supply: 10.0
    x_lb: -6.0
    x_ub: -4.0
    ruiz_iters: 30
    eta_scale: 0.5
solver:
  mip_gap: 0.05
  time_limit: 3600
  mip_focus: 2
  threads: ${cluster.cpus}
  seed: 0
  obbt_solver: gurobi
  tighten_objective_bounds: null
  convex_hull_cuts: false
  cut_rounds: 1
  save_logs: true
  extra_params: {}
  obbt_params: {}
schedule:
  k_max: 200
  budget_hours: 20.0
  build_margin_min: 10
  sequential_warm_start: true
  sample_start: true
  n_start_samples: 10000
  start_samples_seed: 0
  run_mip: true
simulator:
  enabled: true
  n_samples: 1000
  seed: 0
  k_max: ${schedule.k_max}
  cross_check: true
cluster:
  cpus: 16
  mem: 32G
  time: null
  slack_min: 30
  partition: ou_sloan_batch
  mail: vranjan1@mit.edu
  mail_type: FAIL,TIME_LIMIT
run_dir: /nfs/sloanlab007/projects/pdopt_proj/vranjan/fomtools_experiments/network/results/run_001
variant: null
variant_index: 2
label: 15x20 / n10 / 10x15 / h5
