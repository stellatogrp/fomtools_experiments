# OSQP's ADMM on portfolio rebalancing over the drifted capped simplex (paper
# Sec. 6.4; portfolio/). Every other constant (kappa, lambd, z_bar, d, the mu
# model, the drift, rho, sigma, alpha) is the CVXPYgen comparison's, from
# portfolio/portfolio_cvxpygen/model.py.
name: portfolio
dir: portfolio
variants: [simplex]
problem:
  n: 10                # assets
  factors: 2           # k: Sigma = F F' + d I with F of size n x k
  mu_model: box        # box | neutral | factor | fixed (portfolio/problem.py)
  s_max: null          # null: model.S_MAX
  exposures: true      # false: dense Sigma = F F' + d I, no exposure variables or rows
  # ADMM: rho from model.ADMM; sigma and alpha are the paper's verified iteration
  # (plain ADMM), not OSQP's 1e-6 and 1.6 that the CVXPYgen timings use (null: model.ADMM).
  sigma: 1.0e-4
  alpha: 1.0
