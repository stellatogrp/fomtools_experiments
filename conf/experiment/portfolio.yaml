# OSQP's ADMM on portfolio rebalancing over the drifted capped simplex (paper
# Sec. 6.4; portfolio/). Every other constant (kappa, lambd, z_bar, d, the mu
# model, the drift, rho, sigma, alpha) is the CVXPYgen comparison's, from
# portfolio/portfolio_cvxpygen/model.py.
name: portfolio
dir: portfolio
variants: [simplex]
problem:
  n: 10                # assets
  factors: 2           # k: Sigma = F F' + d I with F of size n x k
  vary_mu: true        # false: mu fixed at mu_bar, only x varies
