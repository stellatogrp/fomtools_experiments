# PDHG and momentum PDHG on min-cost network flow with gains, unscaled and with
# two-sided Ruiz (paper Sec. 6.4; network/). Defaults are the paper's instance.
name: network
dir: network
variants: [unscaled, ruiz, unscaled_momentum, ruiz_momentum]
problem:
  ns: 3                # supply nodes
  nd: 4                # demand nodes
  seed: 20
  gain_spread: 100.0   # gains log-uniform on [1/sqrt(spread), sqrt(spread)]
  cost_range: [1.0, 10.0]
  capacity_range: [2.0, 6.0]
  supply: 10.0
  x_lb: -6.0           # demand box [x_lb, x_ub]^nd
  x_ub: -4.0
  warm_start: largest  # s^0 solves the LP at: largest = x_lb (the largest demand), center = box centre
  ruiz_iters: 30
  eta_scale: 0.5       # eta = eta_scale / ||[A_s; A_d]||
