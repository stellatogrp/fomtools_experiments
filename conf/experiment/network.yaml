# PDHG and momentum PDHG on min-cost network flow with gains, unscaled and with
# two-sided Ruiz (paper Sec. 6.3; network/). Defaults are the paper's instance
# (archived run: network/results/run_005).
name: network
dir: network
variants: [unscaled, ruiz, unscaled_momentum, ruiz_momentum]
k_max: 39              # the horizon the paper plots; sets schedule.k_max
problem:
  ns: 10               # supply nodes
  nd: 15               # demand nodes
  edge_prob: 0.3       # each supply-demand edge present with this probability; 1 = complete bipartite
  seed: 285
  gain_spread: 100.0   # gains log-uniform on [1/sqrt(spread), sqrt(spread)]
  cost_range: [1.0, 10.0]
  capacity_range: [2.0, 6.0]
  supply: 6.0
  x_lb: -6.0           # demand box [x_lb, x_ub]^nd
  x_ub: -4.0
  warm_start: center   # s^0 solves the LP at: largest = x_lb (the largest demand), center = box centre
  ruiz_iters: 30
  eta_scale: 0.8       # eta = eta_scale / ||[A_s; A_d]||
